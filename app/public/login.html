<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Gato Preto</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.login.css">
<link rel="icon" href="/logo.png" type="image/png">
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">Gato <span>Preto</span></div>
    <div class="logo-sub">Catálogo de Autopeças</div>
  </div>
  <h2>Acesso administrativo</h2>
  <form id="loginForm">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email" placeholder="seu@email.com" required>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button class="btn" type="submit" id="btn">Entrar</button>
    <div class="error" id="err"></div>
  </form>
  <a class="back" href="/">← Voltar ao catálogo</a>
</div>
<script src="js/login.js"></script>
</body>
</html>
