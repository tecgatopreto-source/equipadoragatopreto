<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Gato Preto</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.login.css">
<link rel="icon" href="logo.png" type="image/png">
</head>
<body class="login-shell">
<div class="login-card">
  <div class="login-logo">
    <img src="logo.png" alt="Gato Preto">
  </div>
  <h1 class="login-title">Controle de Produtos</h1>
  <p class="login-sub">Entre com sua conta para continuar</p>
  <form id="loginForm">
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email" placeholder="seu@email.com" required>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <div class="error" id="err">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex-shrink:0;margin-top:1px;">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span id="err-text"></span>
    </div>
    <button class="btn" type="submit" id="btn">Entrar</button>
  </form>
  <a class="back" href="#" onclick="location.href=(window.APP_BASE||'')+'/';return false;">← Voltar ao catálogo</a>
</div>
<script src="js/login.js"></script>
</body>
</html>
