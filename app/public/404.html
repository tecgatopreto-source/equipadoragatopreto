<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Página não encontrada · Catálogo de Produtos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Caminhos absolutos: o 404 responde em qualquer profundidade (/a/b/c), onde
     "./css" apontaria para o lugar errado. __BASE__ vira o BASE_PATH no app.js. -->
<link rel="stylesheet" href="__BASE__/css/tokens.css">
<link rel="stylesheet" href="__BASE__/css/style.login.css">
<link rel="icon" href="__BASE__/logo.png" type="image/png">
</head>
<body class="login-shell">
<div class="login-card">
  <div class="login-logo">
    <img src="__BASE__/logo.png" alt="Gato Preto">
  </div>
  <h1 class="login-title">Catálogo de Produtos</h1>
  <p class="login-sub">Página não encontrada</p>
  <p class="passagem-texto">O endereço que você tentou acessar não existe ou foi movido.</p>
  <a class="btn" href="__BASE__/">Voltar ao catálogo</a>
</div>
</body>
</html>
